<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu portal | Darwin Optima</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2529;--ink-2:#171C1F;--paper:#F4F4F1;--white:#fff;--line:rgba(31,37,41,.10);--line-d:rgba(244,244,241,.12);--mute:#5B6670;--mute-d:#A9B3B8;--mint:#9CD1CC;--teal:#3F7D76;--amber:#B7791F;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}p{margin:0}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 15px var(--sans);padding:14px 22px;border-radius:2px;border:0;background:var(--mint);color:var(--ink);cursor:pointer;width:100%}
.btn:hover{background:#B5DEDA}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.l-brand{background:var(--ink);color:#F4F4F1;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.l-brand h1{font-size:clamp(34px,3.6vw,52px);line-height:1.1;max-width:460px}
.l-brand p{color:var(--mute-d);max-width:420px;margin-top:20px;font-size:16px}
.l-brand .foot{font-size:13px;color:var(--mute-d)}
.l-brand svg.art{position:absolute;right:-60px;bottom:-60px;width:360px;opacity:.5}
.l-form{display:flex;align-items:center;justify-content:center;padding:48px}
.l-card{width:100%;max-width:380px}
.l-card h2{font-size:30px;margin:10px 0 8px}
.l-card .sub{color:var(--mute);margin-bottom:32px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}
input{width:100%;font:15px var(--sans);padding:14px 14px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);margin-bottom:16px;outline:none}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(63,125,118,.12)}
.hint{font-size:13px;color:var(--mute);margin-top:18px;display:flex;gap:8px;align-items:flex-start}
.sent{display:none;padding:18px;background:#E4F1EE;border-left:2px solid var(--teal);margin-top:20px;font-size:14px}
.demo{margin-top:16px;font-size:13px;color:var(--teal);border-bottom:1px solid currentColor;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font-family:var(--sans)}
.err{color:#A33;font-size:13px;margin:-8px 0 14px;display:none}
@media(max-width:860px){#login{grid-template-columns:1fr}.l-brand{padding:36px 28px;min-height:auto}.l-brand .foot{display:none}.l-brand svg.art{display:none}.l-form{padding:40px 24px}}
/* app */
#app{display:none;min-height:100vh;grid-template-columns:248px 1fr}
.side{background:var(--ink);color:#C9D0D3;padding:28px 20px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:600;padding:0 10px 28px;border-bottom:1px solid var(--line-d);margin-bottom:18px}
.side a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:2px;font-size:14px}
.side a:hover{background:rgba(255,255,255,.05);color:#fff}
.side a.on{background:rgba(156,209,204,.12);color:#fff}
.side svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.side .me{margin-top:auto;border-top:1px solid var(--line-d);padding:18px 10px 0;font-size:13px}
.side .me b{display:block;color:#fff;font-weight:500}
.side .me button{margin-top:10px;background:none;border:0;color:var(--mute-d);font:13px var(--sans);cursor:pointer;padding:0}
main{padding:44px 52px 80px;max-width:1120px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.top h1{font-size:40px;line-height:1.1;margin-top:8px}
.top .meta{font-size:13px;color:var(--mute);text-align:right}
.panel{background:#fff;border:1px solid var(--line);padding:28px 30px;margin-bottom:22px}
.panel h3{font-size:22px}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;gap:16px}
.ph a{font-size:13px;color:var(--teal);border-bottom:1px solid currentColor}
/* stages */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px}
.stg{padding:18px 18px 4px 0;position:relative}
.stg+.stg{padding-left:18px}
.stg .bar{height:3px;background:#E3E7E8;margin-bottom:16px}
.stg.done .bar{background:var(--teal)}
.stg.now .bar{background:linear-gradient(90deg,var(--teal) 55%,#E3E7E8 55%)}
.stg .n{font-size:11px;letter-spacing:.14em;color:var(--mute)}
.stg b{display:block;font-weight:500;margin:4px 0 2px}
.stg span{font-size:13px;color:var(--mute)}
.stg.now b{color:var(--teal)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:24px}
.kv div{padding:18px 0}.kv div+div{padding-left:20px;border-left:1px solid var(--line)}
.kv b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1}
.kv span{font-size:12px;color:var(--mute)}
/* lists */
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:500}.row .s{font-size:13px;color:var(--mute)}
.chk{width:18px;height:18px;border:1.5px solid #B9C2C7;border-radius:2px;flex-shrink:0}
.chk.ok{background:var(--teal);border-color:var(--teal);position:relative}
.chk.ok:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.task{display:flex;gap:14px;align-items:flex-start}
.task .done{color:var(--mute);text-decoration:line-through}
.pill{font-size:11px;font-weight:500;letter-spacing:.04em;padding:4px 10px;border-radius:20px;white-space:nowrap}
.p-ok{background:#E4F1EE;color:var(--teal)}.p-wait{background:#FBF1DF;color:#8A5A12}.p-new{background:#EDEFF1;color:var(--mute)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tool{border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.tool:hover{border-color:var(--teal)}
.tool .ic{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--mint);margin-bottom:10px}
.tool .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool b{font-weight:600}.tool span{font-size:13px;color:var(--mute)}
.tool em{font-style:normal;font-size:13px;color:var(--teal);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:0 0 12px;border-bottom:1px solid var(--line)}
td{padding:14px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td a.dl{color:var(--teal);font-size:13px;border-bottom:1px solid currentColor}
.next{background:var(--ink);color:#F4F4F1;border:0}
.next h3{color:#fff}.next .s{color:var(--mute-d)}
.next .when{font-family:var(--serif);font-size:28px;margin:6px 0 4px}
.next a{display:inline-block;margin-top:18px;font-size:13px;color:var(--mint);border-bottom:1px solid currentColor}
.mob{display:none}
@media(max-width:980px){#app{grid-template-columns:1fr}.side{display:none}main{padding:24px 20px 60px}.grid,.tools{grid-template-columns:1fr}.stages{grid-template-columns:1fr 1fr}.stg:nth-child(3){padding-left:0}.mob{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:16px 20px;font-weight:600}.mob button{background:none;border:0;color:var(--mute-d);font:13px var(--sans)}table .hide{display:none}}
.banner{font-size:12px;background:#FBF1DF;color:#8A5A12;text-align:center;padding:8px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
#app.ready{display:grid}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--mute);font-size:14px}
.sent.err2{background:#FBEAEA;border-left-color:#A33}
.btn[disabled]{opacity:.6;cursor:wait}
@media(max-width:980px){.top .meta{text-align:left}}
</style>
</head>
<body>
<div class="loading" id="ld">Cargando tu portal…</div>
<div id="app">
 <aside class="side">
  <div class="brand"><svg width="20" height="24" viewBox="0 0 366 440" aria-hidden="true"><path fill="#9CD1CC" d="M 365 183 A 108.5 108.5 0 1 0 256.5 291.5 L 256.5 183 Z M 256.5 0 A 183 183 0 0 0 256.5 366 L 256.5 331.5 A 148.5 148.5 0 0 1 256.5 34.5 Z M 0 183 A 256.5 256.5 0 0 0 256.5 439.5 L 256.5 405.5 A 222.5 222.5 0 0 1 34 183 Z"/></svg>Darwin Optima</div>
  <a href="#resumen" class="on"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 4v3h6V4z"/></svg>Resumen</a>
  <a href="#avance"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 15l4-4 3 3 5-6"/></svg>Avance</a>
  <a href="#herramientas"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="1"/><path d="M8 21h8"/></svg>Herramientas</a>
  <a href="#documentos"><svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>Documentos</a>
  <a href="#facturacion"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 10h18M7 15h4"/></svg>Facturación</a>
  <div class="me"><b id="me-n"></b><span id="me-e"></span><br><a href="/api/portal/salir" style="display:inline-block;padding:0;margin-top:10px;color:var(--mute-d);font-size:13px">Cerrar sesión</a></div>
 </aside>
 <div>
  <div class="mob"><span>Darwin Optima</span><a href="/api/portal/salir" style="color:var(--mute-d);font-size:13px;font-weight:400">Salir</a></div>
  <main id="main"></main>
 </div>
</div>
<script>
var ICONS={"CapitalOptima": "<span style=\"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#2C5F8A;margin-bottom:12px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"15\" width=\"2.6\" height=\"6\" rx=\"1\" fill=\"#ffffff\" opacity=\"0.55\"></rect><rect x=\"10.7\" y=\"11\" width=\"2.6\" height=\"10\" rx=\"1\" fill=\"#ffffff\" opacity=\"0.55\"></rect><rect x=\"16.4\" y=\"6\" width=\"2.6\" height=\"15\" rx=\"1\" fill=\"#ffffff\" opacity=\"0.55\"></rect><path d=\"M 3 16 L 10.5 9 L 14 11.5 L 21 4\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M 15.5 4 L 21 4 L 21 9.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></span>", "Tarifa Justa": "<span style=\"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#12151C;margin-bottom:12px\"><svg width=\"21\" height=\"22\" viewBox=\"0 0 100 110\" aria-hidden=\"true\"><line x1=\"14\" y1=\"10\" x2=\"14\" y2=\"80\" stroke=\"#F5F1E4\" stroke-width=\"9\" stroke-linecap=\"round\"></line><line x1=\"34\" y1=\"10\" x2=\"34\" y2=\"80\" stroke=\"#F5F1E4\" stroke-width=\"9\" stroke-linecap=\"round\"></line><line x1=\"54\" y1=\"10\" x2=\"54\" y2=\"80\" stroke=\"#F5F1E4\" stroke-width=\"9\" stroke-linecap=\"round\"></line><line x1=\"74\" y1=\"10\" x2=\"74\" y2=\"80\" stroke=\"#E0A526\" stroke-width=\"9\" stroke-linecap=\"round\"></line><line x1=\"4\" y1=\"80\" x2=\"88\" y2=\"8\" stroke=\"#5CC698\" stroke-width=\"11\" stroke-linecap=\"round\"></line></svg></span>", "Quadrant": "<span style=\"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#33386B;margin-bottom:12px\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"2\" y=\"2\" width=\"9\" height=\"9\" rx=\"2.4\" fill=\"#C14A33\"></rect><rect x=\"13\" y=\"2\" width=\"9\" height=\"9\" rx=\"2.4\" fill=\"rgba(246,244,239,0.32)\"></rect><rect x=\"2\" y=\"13\" width=\"9\" height=\"9\" rx=\"2.4\" fill=\"rgba(246,244,239,0.32)\"></rect><rect x=\"13\" y=\"13\" width=\"9\" height=\"9\" rx=\"2.4\" fill=\"rgba(246,244,239,0.32)\"></rect></svg></span>", "ACS": "<span style=\"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#2E9E5B;margin-bottom:12px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"15\" rx=\"2\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.7\"></rect><line x1=\"4\" y1=\"9.5\" x2=\"20\" y2=\"9.5\" stroke=\"#ffffff\" stroke-width=\"1.5\"></line><line x1=\"8\" y1=\"2.7\" x2=\"8\" y2=\"6\" stroke=\"#ffffff\" stroke-width=\"1.7\" stroke-linecap=\"round\"></line><line x1=\"16\" y1=\"2.7\" x2=\"16\" y2=\"6\" stroke=\"#ffffff\" stroke-width=\"1.7\" stroke-linecap=\"round\"></line><path d=\"M 8 14.3 L 11 17.2 L 17 11\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></span>", "PCM": "<span style=\"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#B8860B;margin-bottom:12px\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"none\" stroke=\"#353E44\" stroke-width=\"2.4\"></circle><text x=\"12\" y=\"16.3\" font-size=\"11\" font-weight=\"800\" fill=\"#353E44\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\">$</text></svg></span>"};
var DESC={"CapitalOptima": "Tus estados financieros en vivo", "Tarifa Justa": "Horas por proyecto y facturación", "Quadrant": "Pendientes priorizados del equipo", "ACS": "Agenda y seguimiento de clientes", "PCM": "Tus finanzas personales"};
var STAGES=['Diagnóstico','Plan','Ejecución supervisada','Traspaso'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(u||'')?u:''}
function pd(s){if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s)){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])}return new Date(s)}
function fd(s,o){var d=pd(s);return d?d.toLocaleDateString('es',o||{day:'numeric',month:'short',year:'numeric'}).replace('.',''):''}
function money(n){return n==null?'':'US$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function render(d){
 var c=d.cliente,p=d.proyecto,h='';
 document.getElementById('me-n').textContent=c.nombre;document.getElementById('me-e').textContent=[c.empresa,c.rubro].filter(Boolean).join(' · ');
 var first=(c.nombre||'').split(' ')[0];
 h+='<div class="top" id="resumen"><div><p class="eyebrow">'+esc(c.empresa||'Tu proyecto')+' · Proyecto de reordenamiento</p><h1>Hola, '+esc(first)+'.</h1></div><p class="meta">Consultor: Augusto Balarezo<br>Última actualización: '+esc(fd(d.actualizado))+'</p></div>';
 // avance
 var idx=p.etapa==='Cerrado'?4:STAGES.indexOf(p.etapa);
 var subs=[p.diagnostico?'Completado '+fd(p.diagnostico,{day:'numeric',month:'short'}):'Completado',p.plan?'Aprobado '+fd(p.plan,{day:'numeric',month:'short'}):'Aprobado','',p.traspaso?'Previsto '+fd(p.traspaso,{month:'short',year:'numeric'}):'Pendiente'];
 var st='';
 STAGES.forEach(function(n,i){var cls='',sub='',bar='';
  if(i<idx){cls='done';sub=i===3?'Completado':subs[i]}
  else if(i===idx){cls='now';var a=Math.max(0,Math.min(100,p.avance||0));bar=' style="background:linear-gradient(90deg,var(--teal) '+a+'%,#E3E7E8 '+a+'%)"';sub=(p.avance!=null?a+'% completado':'En curso')}
  else{sub=i===3?subs[3]:'Pendiente'}
  st+='<div class="stg '+cls+'"><div class="bar"'+bar+'></div><span class="n">0'+(i+1)+'</span><b>'+n+'</b><span>'+esc(sub)+'</span></div>'});
 var pill=p.etapa==='Cerrado'?'Proyecto cerrado':(p.semana&&p.semanas?'En curso · semana '+p.semana+' de '+p.semanas:(p.etapa?'En curso':''));
 var kv=d.indicadores.length?'<div class="kv">'+d.indicadores.map(function(x){return '<div><b>'+esc(x.valor)+'</b><span>'+esc(x.etiqueta)+'</span></div>'}).join('')+'</div>':'';
 h+='<div class="grid"><section class="panel" id="avance"><div class="ph"><h3>Avance del proyecto</h3>'+(pill?'<span class="pill p-ok">'+esc(pill)+'</span>':'')+'</div><div class="stages">'+st+'</div>'+kv+'</section>';
 // sesion
 var s=d.sesion,ses='';
 if(s.fecha){var sd=pd(s.fecha);var hasT=s.fecha.length>10;
  ses='<p class="eyebrow" style="color:var(--mint)">Próxima sesión</p><p class="when">'+esc(cap(sd.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})))+'</p><p class="s">'+(hasT?esc(sd.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit',timeZone:'America/Lima'}))+' (hora de Lima)'+(s.tema?' · ':''):'')+esc(s.tema)+'</p>'}
 else ses='<p class="eyebrow" style="color:var(--mint)">Próxima sesión</p><p class="s" style="margin-top:8px">Por coordinar.</p>';
 if(d.mensaje) ses+='<div style="border-top:1px solid var(--line-d);margin-top:26px;padding-top:20px"><p class="eyebrow" style="color:var(--mint);margin-bottom:8px">Mensaje de Augusto</p><p class="s" style="color:#DDE3E5">'+esc(d.mensaje)+'</p></div>';
 h+='<section class="panel next">'+ses+'</section></div>';
 // pendientes
 var open=d.pendientes.filter(function(x){return !x.hecho}),done=d.pendientes.filter(function(x){return x.hecho}).sort(function(a,b){return (b.completado||'').localeCompare(a.completado||'')}).slice(0,3);
 var rows=open.concat(done).map(function(x){
  var meta=[x.responsable?'Responsable: '+x.responsable:'',x.hecho?(x.completado?'Completado '+fd(x.completado,{day:'numeric',month:'short'}):'Completado'):(x.vence?'vence '+fd(x.vence,{day:'numeric',month:'short'}):'')].filter(Boolean).join(' · ');
  var pc=x.etiqueta==='Urgente'?'p-wait" style="background:#FBEAEA;color:#A33':(x.etiqueta==='Hábito'?'p-new':'p-wait');
  return '<div class="row task"><span class="chk'+(x.hecho?' ok':'')+'"></span><div style="flex:1"><p class="t'+(x.hecho?' done':'')+'">'+esc(x.titulo)+'</p><p class="s">'+esc(meta)+'</p></div>'+(!x.hecho&&x.etiqueta?'<span class="pill '+pc+'">'+esc(x.etiqueta)+'</span>':'')+'</div>'}).join('');
 h+='<section class="panel"><div class="ph"><h3>Pendientes de tu equipo</h3><span style="font-size:13px;color:var(--mute)">'+open.length+' abiertos</span></div>'+(rows||'<p class="empty">No hay pendientes por ahora.</p>')+'</section>';
 // herramientas
 if(d.herramientas.length){
  h+='<section class="panel" id="herramientas"><div class="ph"><h3>Tus herramientas</h3></div><div class="tools">'+d.herramientas.map(function(t){var u=safeUrl(t.enlace);return '<a class="tool" href="'+esc(u||'#')+'" target="_blank" rel="noopener">'+(ICONS[t.nombre]||'')+'<b>'+esc(t.nombre)+'</b><span>'+esc(DESC[t.nombre]||'')+'</span><em>Abrir →</em></a>'}).join('')+'</div></section>'}
 // docs + facturas
 var dr=d.documentos.map(function(x){var u=safeUrl(x.enlace);return '<tr><td>'+esc(x.nombre)+'</td><td class="hide">'+esc(fd(x.fecha))+'</td><td class="r">'+(u?'<a class="dl" href="'+esc(u)+'" target="_blank" rel="noopener">Ver</a>':'')+'</td></tr>'}).join('');
