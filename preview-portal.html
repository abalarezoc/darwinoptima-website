<title>Demo del portal | Darwin Optima</title>

<style>
:root{--ink:#142030;--ink-2:#0E1824;--paper:#F4F4F1;--white:#fff;--line:rgba(20,32,48,.10);--line-d:rgba(244,244,241,.12);--mute:#5B6670;--mute-d:#A9B3B8;--mint:#9CD1CC;--teal:#3F7D76;--amber:#B7791F;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}p{margin:0}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 15px var(--sans);padding:14px 22px;border-radius:2px;border:0;background:var(--mint);color:var(--ink);cursor:pointer;width:100%}
.btn:hover{background:#B5DEDA}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.l-brand{background:var(--ink);color:#F4F4F1;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.l-brand h1{font-size:clamp(34px,3.6vw,52px);line-height:1.1;max-width:460px}
.l-brand p{color:var(--mute-d);max-width:420px;margin-top:20px;font-size:16px}
.l-brand .foot{font-size:13px;color:var(--mute-d)}
.l-brand svg.art{position:absolute;right:-60px;bottom:-60px;width:360px;opacity:.5}
.l-form{display:flex;align-items:center;justify-content:center;padding:48px}
.l-card{width:100%;max-width:380px}
.l-card h2{font-size:30px;margin:10px 0 8px}
.l-card .sub{color:var(--mute);margin-bottom:32px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}
input{width:100%;font:15px var(--sans);padding:14px 14px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);margin-bottom:16px;outline:none}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(63,125,118,.12)}
.hint{font-size:13px;color:var(--mute);margin-top:18px;display:flex;gap:8px;align-items:flex-start}
.sent{display:none;padding:18px;background:#E4F1EE;border-left:2px solid var(--teal);margin-top:20px;font-size:14px}
.demo{margin-top:16px;font-size:13px;color:var(--teal);border-bottom:1px solid currentColor;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font-family:var(--sans)}
.err{color:#A33;font-size:13px;margin:-8px 0 14px;display:none}
@media(max-width:860px){#login{grid-template-columns:1fr}.l-brand{padding:36px 28px;min-height:auto}.l-brand .foot{display:none}.l-brand svg.art{display:none}.l-form{padding:40px 24px}}
/* app */
#app{display:none;min-height:100vh;grid-template-columns:248px 1fr}
.side{background:var(--ink);color:#C9D0D3;padding:28px 20px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:600;padding:0 10px 28px;border-bottom:1px solid var(--line-d);margin-bottom:18px}
.side a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:2px;font-size:14px}
.side a:hover{background:rgba(255,255,255,.05);color:#fff}
.side a.on{background:rgba(156,209,204,.12);color:#fff}
.side svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.side .me{margin-top:auto;border-top:1px solid var(--line-d);padding:18px 10px 0;font-size:13px}
.side .me b{display:block;color:#fff;font-weight:500}
.side .me button{margin-top:10px;background:none;border:0;color:var(--mute-d);font:13px var(--sans);cursor:pointer;padding:0}
main{padding:44px 52px 80px;max-width:1120px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.top h1{font-size:40px;line-height:1.1;margin-top:8px}
.top .meta{font-size:13px;color:var(--mute);text-align:right}
.panel{background:#fff;border:1px solid var(--line);padding:28px 30px;margin-bottom:22px}
.panel h3{font-size:22px}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;gap:16px}
.ph a{font-size:13px;color:var(--teal);border-bottom:1px solid currentColor}
/* stages */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px}
.stg{padding:18px 18px 4px 0;position:relative}
.stg+.stg{padding-left:18px}
.stg .bar{height:3px;background:#E3E7E8;margin-bottom:16px}
.stg.done .bar{background:var(--teal)}
.stg.now .bar{background:linear-gradient(90deg,var(--teal) 55%,#E3E7E8 55%)}
.stg .n{font-size:11px;letter-spacing:.14em;color:var(--mute)}
.stg b{display:block;font-weight:500;margin:4px 0 2px}
.stg span{font-size:13px;color:var(--mute)}
.stg.now b{color:var(--teal)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:24px}
.kv div{padding:18px 0}.kv div+div{padding-left:20px;border-left:1px solid var(--line)}
.kv b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1}
.kv span{font-size:12px;color:var(--mute)}
/* lists */
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:500}.row .s{font-size:13px;color:var(--mute)}
.chk{width:18px;height:18px;border:1.5px solid #B9C2C7;border-radius:2px;flex-shrink:0}
.chk.ok{background:var(--teal);border-color:var(--teal);position:relative}
.chk.ok:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.task{display:flex;gap:14px;align-items:flex-start}
.task .done{color:var(--mute);text-decoration:line-through}
.pill{font-size:11px;font-weight:500;letter-spacing:.04em;padding:4px 10px;border-radius:20px;white-space:nowrap}
.p-ok{background:#E4F1EE;color:var(--teal)}.p-wait{background:#FBF1DF;color:#8A5A12}.p-new{background:#EDEFF1;color:var(--mute)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tool{border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.tool:hover{border-color:var(--teal)}
.tool .ic{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--mint);margin-bottom:10px}
.tool .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool b{font-weight:600}.tool span{font-size:13px;color:var(--mute)}
.tool em{font-style:normal;font-size:13px;color:var(--teal);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:0 0 12px;border-bottom:1px solid var(--line)}
td{padding:14px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td a.dl{color:var(--teal);font-size:13px;border-bottom:1px solid currentColor}
.next{background:var(--ink);color:#F4F4F1;border:0}
.next h3{color:#fff}.next .s{color:var(--mute-d)}
.next .when{font-family:var(--serif);font-size:28px;margin:6px 0 4px}
.next a{display:inline-block;margin-top:18px;font-size:13px;color:var(--mint);border-bottom:1px solid currentColor}
.mob{display:none}
@media(max-width:980px){#app{grid-template-columns:1fr}.side{display:none}main{padding:24px 20px 60px}.grid,.tools{grid-template-columns:1fr}.stages{grid-template-columns:1fr 1fr}.stg:nth-child(3){padding-left:0}.mob{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:16px 20px;font-weight:600}.mob button{background:none;border:0;color:var(--mute-d);font:13px var(--sans)}table .hide{display:none}}
.banner{font-size:12px;background:#FBF1DF;color:#8A5A12;text-align:center;padding:8px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
#app.ready{display:grid}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--mute);font-size:14px}
.sent.err2{background:#FBEAEA;border-left-color:#A33}
.btn[disabled]{opacity:.6;cursor:wait}
@media(max-width:980px){.top .meta{text-align:left}}

/* --- vida: animaciones --- */
.dotgrid .gl line{stroke:rgba(156,209,204,.13);stroke-width:1}
.dotgrid circle{fill:#9CD1CC;transform:translate(var(--dx),var(--dy));opacity:.25;transform-box:fill-box;transform-origin:center;animation:settle 2.4s cubic-bezier(.2,.7,.2,1) var(--dl) forwards,breathe var(--b) ease-in-out calc(var(--dl) + 2.4s) infinite}
.dotgrid circle.on{fill:#F4F4F1}
.dotgrid circle.off{fill:#3E5068}
.band .dotgrid circle.tc{fill:var(--c)}
@keyframes settle{to{transform:translate(0,0);opacity:1}}
@keyframes breathe{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(0,0) scale(1.35)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.dotgrid circle{animation:none;transform:none;opacity:1}.panel,.band{animation:none!important}}

body{background-color:var(--paper);background-image:radial-gradient(rgba(20,32,48,.06) 1px,transparent 1px);background-size:22px 22px}
.panel{animation:up .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);transition:box-shadow .25s,transform .25s}
.panel:hover{box-shadow:0 10px 30px -18px rgba(20,32,48,.35)}
.band{position:relative;overflow:hidden;background:var(--ink);color:#F4F4F1;padding:40px 44px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:32px;animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.band h1{font-size:44px;line-height:1.05;margin-top:10px;color:#fff}
.band .eyebrow{color:var(--mint)}
.band .meta{font-size:13px;color:var(--mute-d);margin-top:16px}
.band .dotgrid{position:absolute;right:190px;top:50%;width:300px;height:300px;transform:translateY(-50%);opacity:.55;pointer-events:none}
.ring{position:relative;width:150px;height:150px;flex-shrink:0;z-index:1}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(244,244,241,.12);stroke-width:9}
.ring .val{fill:none;stroke:var(--mint);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.7,.2,1) .4s}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1;color:#fff}
.ring .lbl span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute-d);margin-top:6px}
.stg .bar{position:relative;overflow:hidden;background:#E3E7E8!important}
.stg .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--teal);transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.stg.now .bar i{background:linear-gradient(90deg,var(--teal),var(--mint))}
.stg.now .n::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-left:8px;vertical-align:1px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(156,209,204,.7)}50%{box-shadow:0 0 0 6px rgba(156,209,204,0)}}
.kv b{color:var(--ink)}
.kv div:first-child b{color:var(--teal)}
.chip{display:inline-block;margin-top:14px;font-size:12px;font-weight:500;background:rgba(156,209,204,.16);color:var(--mint);padding:5px 12px;border-radius:20px}
.tool{position:relative;transition:transform .25s,box-shadow .25s,border-color .25s}
.tool::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--tc,#9CD1CC);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.tool:hover{transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(20,32,48,.45)}
.tool:hover::before{transform:scaleX(1)}
.tool em{transition:letter-spacing .25s}.tool:hover em{letter-spacing:.04em}
.row.task{transition:background .2s}.row.task:hover{background:rgba(156,209,204,.08)}
.side a.on{box-shadow:inset 2px 0 0 var(--mint)}
@media(max-width:980px){.band{flex-direction:column;align-items:flex-start;padding:30px 24px}.band .dotgrid{display:none}.band h1{font-size:34px}.ring{align-self:center}}
</style>
</head>
