<style>
:root{--ink:#142030;--ink-2:#0E1824;--paper:#F4F4F1;--line:rgba(20,32,48,.12);--line-d:rgba(244,244,241,.12);--mute:#5B6670;--mute-d:#A9B3B8;--mint:#9CD1CC;--teal:#3F7D76;--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.dark{background:var(--ink);color:#F4F4F1}
.eyebrow{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.dark .eyebrow{color:var(--mint)}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(42px,6.2vw,80px);line-height:1.04}
h2{font-size:clamp(32px,4vw,52px);line-height:1.1}
h3{font-size:22px;line-height:1.3}
p{margin:0}
.lead{font-size:clamp(18px,1.6vw,21px);line-height:1.6;color:var(--mute)}
.dark .lead{color:var(--mute-d)}
.btn{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;padding:15px 26px;border-radius:2px;background:var(--mint);color:var(--ink);transition:background .2s}
.btn:hover{background:#B5DEDA}
.btn-line{background:transparent;color:inherit;border:1px solid currentColor;opacity:.85}
.btn-line:hover{background:transparent;opacity:1}
.link{font-size:15px;font-weight:500;border-bottom:1px solid currentColor;padding-bottom:2px}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(20,32,48,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-d)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:12px;color:#F4F4F1;font-weight:600;font-size:16px;letter-spacing:.01em}
.menu{display:flex;align-items:center;gap:36px}
.menu a{font-size:14px;color:#C9D0D3;transition:color .2s}
.menu a:hover{color:#fff}
.menu .cta{color:var(--ink);background:var(--mint);padding:10px 18px;border-radius:2px;font-weight:500}
.menu .cta:hover{color:var(--ink);background:#B5DEDA}
.nav .wrap{position:relative}
.login{display:inline-flex;align-items:center;gap:7px;padding-left:28px;border-left:1px solid var(--line-d)}
.burger{display:none;background:none;border:0;color:#F4F4F1;padding:8px;margin-right:-8px;cursor:pointer}
@media(max-width:820px){.wrap{padding:0 22px}}
@media(max-width:1000px){.burger{display:block}.menu{display:none;position:absolute;top:72px;left:0;right:0;background:var(--ink);flex-direction:column;align-items:stretch;gap:0;padding:4px 22px 24px;border-bottom:1px solid var(--line-d)}.menu.open{display:flex}.menu a{padding:15px 0;font-size:16px;border-bottom:1px solid var(--line-d)}.menu .login{padding-left:0;border-left:0}.menu .cta{margin-top:18px;text-align:center;border-bottom:0;padding:14px 18px}}
/* hero */
.hero{padding:120px 0 0}
.hero .eyebrow{margin-bottom:28px}
.hero h1{max-width:900px}
.hero .lead{max-width:600px;margin-top:28px}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:28px;margin-top:44px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:110px;border-top:1px solid var(--line-d)}
.stat{padding:30px 28px 40px 0}
.stat+.stat{padding-left:28px;border-left:1px solid var(--line-d)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;color:#fff}
.stat span{display:block;margin-top:12px;font-size:13px;line-height:1.5;color:var(--mute-d)}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){padding-left:0;border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line-d)}}
/* sections */
section{padding:120px 0}
.head{display:grid;grid-template-columns:260px 1fr;gap:40px;margin-bottom:64px}
.head .eyebrow{padding-top:14px}
.head .lead{margin-top:20px;max-width:640px}
@media(max-width:900px){.head{grid-template-columns:1fr;gap:16px}.head .eyebrow{padding-top:0}}
.rows{border-top:1px solid var(--line)}
.dark .rows{border-color:var(--line-d)}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:64px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
@media(max-width:900px){.grid2,.grid4{grid-template-columns:1fr}}
.item{padding:30px 0;border-bottom:1px solid var(--line)}
.dark .item{border-color:var(--line-d)}
.item .n{font-size:12px;letter-spacing:.14em;color:var(--teal);font-weight:500}
.dark .item .n{color:var(--mint)}
.item h3{margin:10px 0 8px}
.item p{color:var(--mute);font-size:16px}
.dark .item p{color:var(--mute-d)}
.steps .item{padding-right:28px;border-bottom:0;border-top:1px solid var(--line)}
.steps .item + .item{padding-left:28px;border-left:1px solid var(--line)}
@media(max-width:900px){.steps .item + .item{padding-left:0;border-left:0}}
.statement{font-family:var(--serif);font-size:clamp(26px,3vw,38px);line-height:1.3;max-width:900px}
.statement em{font-style:italic;color:var(--teal)}
/* about */
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:80px}
@media(max-width:960px){.about{grid-template-columns:1fr;gap:48px}}
.about p+p{margin-top:20px}
.creds .item{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:22px 0}
.creds .item b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.25;color:#fff}
@media(max-width:560px){.creds .item{grid-template-columns:1fr;gap:6px}}
/* cases */
.case{padding:40px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:baseline}
.case b{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5vw,64px);line-height:1;color:var(--ink)}
.case h3{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.02em;margin-bottom:8px}
.case p{color:var(--mute);font-size:16px;max-width:680px}
@media(max-width:900px){.case{grid-template-columns:1fr;gap:14px}}
/* tools */
.tools{display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:start}
@media(max-width:960px){.tools{grid-template-columns:1fr;gap:48px}}
.tool{display:flex;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid var(--line-d)}
.tool b{font-weight:600;color:#fff}
.tool span{color:var(--mute-d);font-size:15px;text-align:right}
/* fit */
.fit{display:grid;grid-template-columns:1fr 1fr;gap:64px}
@media(max-width:900px){.fit{grid-template-columns:1fr;gap:40px}}
.fit ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.fit li{display:grid;grid-template-columns:28px 1fr;padding:18px 0;border-bottom:1px solid var(--line);font-size:17px}
.fit li i{font-style:normal;color:var(--teal);font-weight:600}
.fit .no li{color:var(--mute)}
.fit .no li i{color:#9AA3A9}
.fit h3{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px}
.quote{margin-top:56px;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--teal)}
/* faq */
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:26px 0;font-family:var(--serif);font-size:22px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--sans);font-weight:300;font-size:26px;line-height:1;color:var(--teal);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 28px;color:var(--mute);max-width:720px}
/* cta */
.cta-final{padding:140px 0}
.cta-final h2{font-size:clamp(40px,5.6vw,72px)}
.cta-final .lead{max-width:620px;margin-top:28px}
.small{font-size:14px;color:var(--mint);margin-top:18px}
footer{background:var(--ink-2);color:var(--mute-d);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding-top:40px;padding-bottom:40px}
footer nav{display:flex;flex-wrap:wrap;gap:28px}
footer a:hover{color:#fff}

.hero .wrap{position:relative}
.hero-art{position:absolute;right:32px;top:-20px;width:360px;height:360px;opacity:.9}
.hero-art .grid-lines line{stroke:rgba(156,209,204,.12);stroke-width:1}
.hero-art circle{transform:translate(var(--dx),var(--dy));opacity:.35;animation:settle 2.4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes settle{to{transform:translate(0,0);opacity:1}}
@media(prefers-reduced-motion:reduce){.hero-art circle{animation:none;transform:none;opacity:1}}
@media(min-width:1181px){.hero h1{max-width:700px}.hero .lead{max-width:560px}}
@media(max-width:1180px){.hero-art{display:none}}
.ico{width:30px;height:30px;fill:none;stroke:var(--teal);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;margin-bottom:16px}
.band{background:#DDEDEA;padding:96px 0}
.band-in{display:grid;grid-template-columns:80px 1fr;gap:32px;align-items:start}
.band .statement{color:var(--ink)}
@media(max-width:700px){.band-in{grid-template-columns:1fr}}
.case{grid-template-columns:260px 1fr 200px}
.spark{width:200px;height:60px;overflow:visible}
.spark .ln{fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .dim{stroke:#B9C2C7;stroke-dasharray:4 4}
.spark .pt{fill:var(--teal)}
.spark .ring{fill:none;stroke:#9CD1CC;stroke-width:2}
.spark .bar{fill:#C9E3DF}.spark .hi{fill:var(--teal)}
@media(max-width:900px){.case{grid-template-columns:1fr}.spark{width:160px}}

.nf{min-height:calc(100vh - 72px);display:flex;align-items:center}
.nf h1{font-size:clamp(40px,6vw,72px);max-width:760px;margin-top:20px}
.nf .lead{max-width:520px;margin-top:22px}
</style>
</head>

 </div>
